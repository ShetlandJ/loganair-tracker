name: track

on:
  schedule:
    # Odd minute: GitHub delays or drops jobs scheduled on the hour.
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: track
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python track.py
      - name: Open an issue for price drops
        if: hashFiles('drops.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Fare drop $(date -u +%Y-%m-%d\ %H:%MZ)" --body-file drops.md
      - name: Commit data
        run: |
          git config user.name "fare-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git push
